etnexus {
  server {
    host = "0.0.0.0"
    host = ${?HOST}
    port = 8080
    port = ${?PORT}
  }

  postgres {
    url      = "jdbc:postgresql://localhost:5432/etnexus_db"
    url      = ${?POSTGRES_URL}
    user     = "etnexus"
    user     = ${?POSTGRES_USER}
    password = "etnexus_secret"
    password = ${?POSTGRES_PASSWORD}
    driver   = "org.postgresql.Driver"
    connectionPool = "HikariCP"
    numThreads = 10
    maxConnections = 20
  }

  redis {
    host = "localhost"
    host = ${?REDIS_HOST}
    port = 6379
    port = ${?REDIS_PORT}
    ttl-seconds = 300           # 5 min LLM cache TTL
  }

  llm {
    provider    = "gemini"      # gemini | groq
    api-key     = ${?LLM_API_KEY}
    model       = "gemini-1.5-flash"
    timeout-ms  = 15000
  }
}

akka {
  loglevel = "INFO"
  http {
    server {
      idle-timeout    = 60s
      request-timeout = 30s
    }
    client {
      connecting-timeout = 10s
    }
  }
}
